<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PopZen</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK (Rewarded Interstitial) -->
  <script src="https://libtl.com/sdk.js" data-zone="12162761" data-sdk="show_12162761"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff; overflow: hidden; user-select: none; overscroll-behavior: none;
    }
    #app {
      display: flex; flex-direction: column; height: 100vh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-size: 22px; font-weight: 700; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ff6bcb, #8a7bff, #4facfe);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-right { display: flex; gap: 8px; align-items: center; }
    .best-box {
      background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.35);
      border-radius: 12px; padding: 6px 12px; font-size: 14px; font-weight: 700;
      color: #ffd700; text-align: center;
    }
    .score-box {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; padding: 6px 14px; font-size: 15px; font-weight: 600;
      min-width: 90px; text-align: center;
    }
    .score-box span { color: #8a7bff; }

    /* Trap vision indicator */
    #trapVisionBar {
      display: none;
      background: linear-gradient(90deg, rgba(255,80,80,0.3), rgba(255,160,0,0.3));
      border: 1px solid rgba(255,120,80,0.6);
      border-radius: 12px; padding: 8px 14px;
      font-size: 14px; font-weight: 700; margin-bottom: 10px;
      text-align: center; color: #ffcc99;
      animation: tvPulse 1s infinite;
    }
    #trapVisionBar.active { display: block; }
    @keyframes tvPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

    /* Streak banner */
    .streak-banner {
      background: linear-gradient(90deg, rgba(255,107,203,0.2), rgba(138,123,255,0.2));
      border: 1px solid rgba(255,107,203,0.4);
      border-radius: 12px; padding: 8px 14px;
      font-size: 14px; font-weight: 600; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .streak-reward {
      margin-left: auto; font-size: 12px; color: #ffd1ff; font-weight: 500;
    }

    /* Mode tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab {
      flex: 1; padding: 10px; border-radius: 12px; text-align: center;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .tab.active {
      background: rgba(138,123,255,0.25); border-color: rgba(138,123,255,0.6);
    }

    /* Panels */
    .panel { flex: 1; display: none; overflow: hidden; }
    .panel.active { display: flex; flex-direction: column; }

    /* ===== BUBBLES ===== */
    #grid {
      flex: 1; display: grid; grid-template-columns: repeat(6, 1fr);
      gap: 8px; align-content: start; overflow: hidden;
    }
    .bubble {
      aspect-ratio: 1 / 1; border-radius: 50%; cursor: pointer; position: relative;
      transition: transform 0.08s ease, opacity 0.2s ease;
      box-shadow: inset -3px -3px 8px rgba(0,0,0,0.25),
                  inset 3px 3px 8px rgba(255,255,255,0.35),
                  0 2px 6px rgba(0,0,0,0.3);
    }
    .bubble:active { transform: scale(0.85); }
    .bubble.popped { opacity: 0; transform: scale(0.3); pointer-events: none; }
    .bubble.c0 { background: radial-gradient(circle at 30% 30%, #ff9a9e, #f6416c); }
    .bubble.c1 { background: radial-gradient(circle at 30% 30%, #a1c4fd, #3a7bd5); }
    .bubble.c2 { background: radial-gradient(circle at 30% 30%, #fddb92, #f7a325); }
    .bubble.c3 { background: radial-gradient(circle at 30% 30%, #a8edea, #28c7a8); }
    .bubble.c4 { background: radial-gradient(circle at 30% 30%, #d4a5ff, #8a2be2); }
    .bubble.c5 { background: radial-gradient(circle at 30% 30%, #ffd1ff, #ff6bcb); }

    /* Skins must NOT affect traps */
    body.skin-glitter .bubble:not(.trap.visible) {
      background-image:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, transparent 40%),
        repeating-conic-gradient(from 0deg, rgba(255,255,255,0.35) 0deg 10deg, transparent 10deg 20deg);
      background-blend-mode: overlay;
    }
    body.skin-neon .bubble:not(.trap.visible) {
      box-shadow: 0 0 14px 2px currentColor,
                  inset -3px -3px 8px rgba(0,0,0,0.25),
                  inset 3px 3px 8px rgba(255,255,255,0.35);
    }

    /* Traps — hidden by default, visible only with trap vision */
    .bubble.trap { pointer-events: auto; }
    .bubble.trap.visible {
      background: radial-gradient(circle at 35% 30%, #ff6b6b, #c0392b) !important;
      box-shadow: 0 0 16px 3px rgba(255,60,60,0.8),
                  inset -3px -3px 8px rgba(0,0,0,0.3),
                  inset 3px 3px 8px rgba(255,255,255,0.25) !important;
      animation: trapPulse 0.9s infinite;
    }
    .bubble.trap.visible::after {
      content: '💥';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 60%;
    }
    @keyframes trapPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.92); }
    }
    .bubble.trap.fading { opacity: 0; transform: scale(0.4); transition: opacity 0.3s, transform 0.3s; }

    /* ===== LEADERBOARD ===== */
    #leaderboardWrap {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    #leaderboardList {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding-right: 4px;
    }
    .lb-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; margin-bottom: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-size: 14px;
    }
    .lb-row.self {
      background: rgba(138,123,255,0.25);
      border-color: rgba(138,123,255,0.6);
    }
    .lb-row.house {
      background: rgba(255,215,0,0.1);
      border-color: rgba(255,215,0,0.4);
    }
    .lb-rank {
      font-weight: 800; min-width: 32px; text-align: center;
      color: #ffd700;
    }
    .lb-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 600;
    }
    .lb-score {
      font-weight: 700; color: #8a7bff; min-width: 50px; text-align: right;
    }
    .lb-prize {
      min-width: 50px; text-align: right; font-weight: 700;
      color: #4ade80; font-size: 12px;
    }
    .lb-prize.none { color: rgba(255,255,255,0.35); }
    .lb-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 6px;
      background: rgba(255,215,0,0.2); color: #ffd700; font-weight: 700;
    }
    .lb-empty {
      text-align: center; padding: 40px 20px; opacity: 0.6; font-size: 14px;
    }
    .lb-refresh {
      background: rgba(79,172,254,0.25);
      border: 1px solid rgba(79,172,254,0.5);
      border-radius: 12px; padding: 10px;
      font-size: 13px; font-weight: 600; color: #fff;
      margin-top: 8px; cursor: pointer; width: 100%;
    }

    /* Footer */
    .footer { margin-top: 12px; display: flex; gap: 8px; }
    button {
      border: none; border-radius: 14px; padding: 14px 10px;
      font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      flex: 1;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #shareBtn {
      background: rgba(79,172,254,0.25);
      border: 1px solid rgba(79,172,254,0.5);
      flex: 0.7;
    }
    #adBtn {
      background: linear-gradient(90deg, #ff6bcb, #8a7bff);
      box-shadow: 0 4px 16px rgba(138,123,255,0.4);
      flex: 1.3;
    }
    #adBtn.tv-active {
      background: linear-gradient(90deg, #ff6b3d, #ff3d6b);
      box-shadow: 0 4px 16px rgba(255,80,60,0.5);
      animation: tvPulse 1s infinite;
    }

    #toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 20px;
      font-size: 14px; opacity: 0; pointer-events: none;
      transition: opacity 0.25s, transform 0.25s; white-space: nowrap; z-index: 10;
      max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Overlays */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 20; backdrop-filter: blur(6px);
    }
    .overlay.show { display: flex; }
    .overlay-card {
      background: linear-gradient(160deg, #1e2a4a, #16213e);
      border: 1px solid rgba(138,123,255,0.5);
      border-radius: 24px; padding: 32px 28px; text-align: center;
      max-width: 320px; width: 85%;
      animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    @keyframes cardPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .overlay-emoji { font-size: 56px; margin-bottom: 12px; }
    .overlay-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .overlay-title.record { color: #ffd700; }
    .overlay-title.gameover { color: #ff6b6b; }
    .overlay-sub { font-size: 15px; opacity: 0.8; margin-bottom: 24px; }
    .overlay-btn {
      background: linear-gradient(90deg, #8a7bff, #4facfe);
      box-shadow: 0 4px 16px rgba(138,123,255,0.5);
      font-size: 16px; padding: 14px; width: 100%;
    }
    .overlay-btn.secondary {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      margin-top: 10px; font-size: 14px;
    }

    /* Channel gate overlay */
    #gateOverlay {
      z-index: 30;
      background: rgba(0,0,0,0.92);
    }
    .gate-spinner {
      width: 32px; height: 32px; margin: 16px auto;
      border: 3px solid rgba(138,123,255,0.3);
      border-top-color: #8a7bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="title">PopZen</div>
      <div class="header-right">
        <div class="best-box">Best: <span id="best">0</span></div>
        <div class="score-box">Score: <span id="score">0</span></div>
      </div>
    </header>

    <!-- Trap vision countdown -->
    <div id="trapVisionBar">👁️ Trap Vision — <span id="trapVisionSecs">0</span>s</div>

    <!-- Daily streak banner -->
    <div id="streakBanner" class="streak-banner" style="display:none;">
      🔥 <span id="streakCount">0</span>-day streak
      <span id="streakReward" class="streak-reward"></span>
    </div>

    <div class="tabs">
      <div class="tab active" data-mode="bubbles">🫧 Bubbles</div>
      <div class="tab" data-mode="leaderboard">🏆 Leaderboard</div>
    </div>

    <!-- BUBBLES PANEL -->
    <div class="panel active" id="panel-bubbles">
      <div id="grid"></div>
    </div>

    <!-- LEADERBOARD PANEL -->
    <div class="panel" id="panel-leaderboard">
      <div id="leaderboardWrap">
        <div id="leaderboardList">
          <div class="lb-empty">Loading leaderboard…</div>
        </div>
        <button class="lb-refresh" id="lbRefreshBtn">🔄 Refresh</button>
      </div>
    </div>

    <div class="footer">
      <button id="shareBtn">📤 Share</button>
      <button id="adBtn">🎁 Unlock</button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Record overlay -->
  <div id="recordOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-emoji">🏆</div>
      <div class="overlay-title record">New Record!</div>
      <div class="overlay-sub">You scored <span id="recordScore">0</span> — amazing!</div>
      <button class="overlay-btn" id="recordClose">Keep popping</button>
    </div>
  </div>

  <!-- Game over overlay -->
  <div id="gameOverOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-emoji">💥</div>
      <div class="overlay-title gameover">Boom! Trap hit</div>
      <div class="overlay-sub">You scored <span id="finalScore">0</span></div>
      <button class="overlay-btn" id="restartBtn">Play again</button>
    </div>
  </div>

  <!-- Channel gate overlay -->
  <div id="gateOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-emoji">📢</div>
      <div class="overlay-title">Join our channel</div>
      <div class="overlay-sub">You must be a member of our updates channel to play.</div>
      <div id="gateStatus" style="font-size:13px; opacity:0.8; margin-bottom:20px;">Checking membership…</div>
      <div class="gate-spinner" id="gateSpinner"></div>
      <button class="overlay-btn" id="gateJoinBtn" style="display:none;">Join Channel</button>
      <button class="overlay-btn secondary" id="gateCheckBtn" style="display:none;">I've joined — verify</button>
    </div>
  </div>

  <script>
    /* =========================================================
       TELEGRAM
       ========================================================= */
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    /* =========================================================
       CONFIG
       ========================================================= */
    const CHANNEL_URL = 'https://t.me/popzen_community'; // change if your channel username differs
    const CHANNEL_USERNAME = 'popzen_community';          // without @, or numeric -100… in env
    const TRAP_VISION_MS = 10000;                      // 10 seconds
    const AD_COOLDOWN_MS = 10000;                      // 10 seconds
    const GRID_COUNT = 36;
    const LEADERBOARD_LIMIT = 50;

    /* =========================================================
       STATE
       ========================================================= */
    const state = {
      mode: 'bubbles',
      score: 0,
      bestScore: parseInt(localStorage.getItem('popzen_best') || '0', 10),
      bubbleSkins: ['default', 'glitter', 'neon'],
      bubbleUnlocked: new Set(['default']),
      bubbleActive: 'default',
      adCooldownUntil: 0,
      adPlaying: false,
      adCooldownMs: AD_COOLDOWN_MS,
      trapVisionUntil: 0,
      gameOver: false,
      recordShownThisGame: false,
      telegramUserId: tg?.initDataUnsafe?.user?.id || null,
      telegramUsername: tg?.initDataUnsafe?.user?.username || null,
      telegramFirstName: tg?.initDataUnsafe?.user?.first_name || null,
      verified: false,
      scoreWritePending: false,
    };

    /* =========================================================
       DOM
       ========================================================= */
    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const adBtn = document.getElementById('adBtn');
    const shareBtn = document.getElementById('shareBtn');
    const toastEl = document.getElementById('toast');
    const tabs = document.querySelectorAll('.tab');
    const panelBubbles = document.getElementById('panel-bubbles');
    const panelLeaderboard = document.getElementById('panel-leaderboard');
    const trapVisionBar = document.getElementById('trapVisionBar');
    const trapVisionSecs = document.getElementById('trapVisionSecs');
    const recordOverlay = document.getElementById('recordOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const gateOverlay = document.getElementById('gateOverlay');
    const gateStatus = document.getElementById('gateStatus');
    const gateSpinner = document.getElementById('gateSpinner');
    const gateJoinBtn = document.getElementById('gateJoinBtn');
    const gateCheckBtn = document.getElementById('gateCheckBtn');
    const leaderboardList = document.getElementById('leaderboardList');
    const lbRefreshBtn = document.getElementById('lbRefreshBtn');

    bestEl.textContent = state.bestScore;

    /* =========================================================
       AUDIO
       ========================================================= */
    let audioCtx = null;
    function beep(freqStart, freqEnd, dur, gainVal = 0.15, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), t + dur);
        g.gain.setValueAtTime(gainVal, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(g).connect(audioCtx.destination);
        osc.start(t); osc.stop(t + dur + 0.02);
      } catch (e) {}
    }
    const playPop = () => beep(600 + Math.random() * 300, 120, 0.1, 0.15);
    const playTrap = () => {
      beep(200, 50, 0.3, 0.25, 'sawtooth');
      setTimeout(() => beep(150, 40, 0.25, 0.2, 'square'), 80);
    };
    const playRecord = () => {
      [523, 659, 784, 1047].forEach((f, i) =>
        setTimeout(() => beep(f, f * 1.01, 0.15, 0.18), i * 100)
      );
    };

    function haptic(type = 'light') {
      try { tg?.HapticFeedback?.impactOccurred(type); } catch (e) {}
    }

    /* =========================================================
       TOAST
       ========================================================= */
    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
    }

    /* =========================================================
       ANALYTICS (DIY track — Telegram ID on open)
       ========================================================= */
    (function trackUser() {
      const userId = state.telegramUserId;
      if (!userId) return;
      fetch('/api/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId,
          username: state.telegramUsername,
          firstName: state.telegramFirstName
        })
      }).catch(err => console.log('[PopZen] Tracking failed:', err));
    })();

    /* =========================================================
       CHANNEL GATE
       ========================================================= */
    async function checkMembership() {
      if (!state.telegramUserId) {
        // Not running inside Telegram — can't verify. Allow play but warn.
        state.verified = true;
        gateOverlay.classList.remove('show');
        return;
      }
      gateOverlay.classList.add('show');
      gateStatus.textContent = 'Checking membership…';
      gateSpinner.style.display = 'block';
      gateJoinBtn.style.display = 'none';
      gateCheckBtn.style.display = 'none';

      try {
        const res = await fetch('/api/check-member', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: state.telegramUserId })
        });
        const data = await res.json();
        if (data.isMember) {
          state.verified = true;
          gateOverlay.classList.remove('show');
          return;
        }
        // Not a member — show join + verify buttons
        gateStatus.textContent = 'You are not a member yet.';
        gateSpinner.style.display = 'none';
        gateJoinBtn.style.display = 'block';
        gateCheckBtn.style.display = 'block';
      } catch (err) {
        console.error('[PopZen] Membership check failed:', err);
        gateStatus.textContent = 'Could not verify membership. Try again.';
        gateSpinner.style.display = 'none';
        gateJoinBtn.style.display = 'block';
        gateCheckBtn.style.display = 'block';
      }
    }

    gateJoinBtn.addEventListener('click', () => {
      const url = CHANNEL_URL;
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, '_blank');
    });

    gateCheckBtn.addEventListener('click', () => {
      checkMembership();
    });

    /* =========================================================
       MODE SWITCH
       ========================================================= */
    function setMode(mode) {
      state.mode = mode;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      panelBubbles.classList.toggle('active', mode === 'bubbles');
      panelLeaderboard.classList.toggle('active', mode === 'leaderboard');
      if (mode === 'bubbles') {
        state.score = 0;
        state.gameOver = false;
        state.recordShownThisGame = false;
        scoreEl.textContent = '0';
        buildGrid();
        updateAdButton();
      } else if (mode === 'leaderboard') {
        loadLeaderboard();
      }
    }
    tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));

    /* =========================================================
       BUBBLES MODE
       ========================================================= */
    function trapRateForScore(score) {
      if (score <= 10) return 0.08;
      if (score <= 25) return 0.15;
      if (score <= 50) return 0.22;
      return 0.30;
    }

    function buildGrid(opts = {}) {
      const { preserveScore = false } = opts;
      gridEl.innerHTML = '';
      state.gameOver = false;
      if (!preserveScore) state.recordShownThisGame = false;

      const rate = trapRateForScore(state.score);
      let trapCount = Math.round(GRID_COUNT * rate);
      trapCount = Math.max(1, Math.min(GRID_COUNT - 5, trapCount));

      const indices = Array.from({ length: GRID_COUNT }, (_, i) => i);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      const trapSet = new Set(indices.slice(0, trapCount));

      for (let i = 0; i < GRID_COUNT; i++) {
        const b = document.createElement('div');
        const colorIdx = Math.floor(Math.random() * 6);
        b.className = `bubble c${colorIdx}`;
        if (trapSet.has(i)) {
          b.classList.add('trap');
          b.dataset.trap = '1';
        }
        // Random size 0.6–1.05 for visual variety
        const scale = 0.6 + Math.random() * 0.45;
        b.style.transform = `scale(${scale})`;
        b.addEventListener('pointerdown', () => handleBubbleClick(b));
        gridEl.appendChild(b);
      }

      refreshTrapVisibility();
    }

    function handleBubbleClick(el) {
      if (state.gameOver) return;
      if (!state.verified) return;
      if (el.classList.contains('popped') || el.classList.contains('fading')) return;

      if (el.classList.contains('trap')) {
        playTrap();
        haptic('heavy');
        state.gameOver = true;
        document.getElementById('finalScore').textContent = state.score;
        gameOverOverlay.classList.add('show');
        return;
      }

      el.classList.add('popped');
      playPop();
      haptic('light');
      setScore(state.score + 1);
      checkGridCleared();
    }

    function checkGridCleared() {
      const remainingSafe = gridEl.querySelectorAll('.bubble:not(.trap):not(.popped)');
      if (remainingSafe.length === 0 && !state.gameOver) {
        gridEl.querySelectorAll('.bubble.trap:not(.fading)').forEach(t => {
          t.classList.add('fading');
        });
        showToast('Grid cleared! 🎉');
        buildGrid({ preserveScore: true });
      }
    }

    function setScore(v) {
      state.score = v;
      scoreEl.textContent = v;

      if (v > state.bestScore && !state.recordShownThisGame) {
        state.recordShownThisGame = true;
        state.bestScore = v;
        bestEl.textContent = v;
        localStorage.setItem('popzen_best', String(v));
        playRecord();
        haptic('medium');
        document.getElementById('recordScore').textContent = v;
        recordOverlay.classList.add('show');
        // Persist score to backend for leaderboard (debounced)
        submitScoreDebounced(v);
      } else if (v > state.bestScore) {
        state.bestScore = v;
        bestEl.textContent = v;
        localStorage.setItem('popzen_best', String(v));
      }
    }

    /* Debounced score submit to /api/score */
    let scoreTimer = null;
    function submitScoreDebounced(score) {
      if (!state.telegramUserId) return;
      clearTimeout(scoreTimer);
      scoreTimer = setTimeout(() => submitScore(score), 1200);
    }
    async function submitScore(score) {
      if (state.scoreWritePending) return;
      state.scoreWritePending = true;
      try {
        await fetch('/api/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: state.telegramUserId,
            username: state.telegramUsername,
            firstName: state.telegramFirstName,
            score
          })
        });
      } catch (err) {
        console.log('[PopZen] Score submit failed:', err);
      } finally {
        state.scoreWritePending = false;
      }
    }

    /* =========================================================
       TRAP VISION
       ========================================================= */
    function trapVisionActive() {
      return Date.now() < state.trapVisionUntil;
    }

    function grantTrapVision(ms) {
      state.trapVisionUntil = Date.now() + ms;
      refreshTrapVisibility();
      updateTrapVisionUI();
    }

    function refreshTrapVisibility() {
      const active = trapVisionActive();
      gridEl.querySelectorAll('.bubble.trap').forEach(el => {
        el.classList.toggle('visible', active);
      });
    }

    function updateTrapVisionUI() {
      const remaining = state.trapVisionUntil - Date.now();
      if (remaining > 0) {
        trapVisionBar.classList.add('active');
        trapVisionSecs.textContent = Math.ceil(remaining / 1000);
        adBtn.classList.add('tv-active');
      } else {
        trapVisionBar.classList.remove('active');
        adBtn.classList.remove('tv-active');
      }
    }

    setInterval(() => {
      if (state.trapVisionUntil > 0) {
        updateTrapVisionUI();
        if (!trapVisionActive()) {
          state.trapVisionUntil = 0;
          refreshTrapVisibility();
          updateAdButton();
        }
      }
    }, 500);

    /* =========================================================
       AD BUTTON
       ========================================================= */
    function nextLocked() {
      return state.bubbleSkins.find(s => !state.bubbleUnlocked.has(s));
    }
    function cooldownRemaining() {
      return Math.max(0, state.adCooldownUntil - Date.now());
    }
    function updateAdButton() {
      if (state.adPlaying) {
        adBtn.textContent = 'Loading ad...';
        adBtn.disabled = true;
        return;
      }
      const cd = cooldownRemaining();
      if (cd > 0) {
        adBtn.textContent = `⏳ ${Math.ceil(cd / 1000)}s`;
        adBtn.disabled = true;
        setTimeout(updateAdButton, 500);
        return;
      }
      const next = nextLocked();
      adBtn.textContent = next
        ? `🎁 Unlock ${next} + 👁️ 10s`
        : `👁️ Watch ad — 10s Trap Vision`;
      adBtn.disabled = false;
    }

    function applyBubbleSkin(skin) {
      state.bubbleActive = skin;
      document.body.classList.remove('skin-glitter', 'skin-neon');
      if (skin !== 'default') document.body.classList.add(`skin-${skin}`);
    }

    /* =========================================================
       MONETAG REWARDED AD
       ========================================================= */
    async function watchRewardedAd() {
      if (state.adPlaying) return;
      if (cooldownRemaining() > 0) return;

      const showAd = window.show_12162761;
      if (typeof showAd !== 'function') {
        showToast('Ad SDK not loaded');
        return;
      }

      state.adPlaying = true;
      updateAdButton();

      try {
        try { await showAd({ type: 'preload' }); } catch (e) {}
        await showAd();

        let unlockedSkin = null;
        unlockedSkin = nextLocked();
        if (unlockedSkin) {
          state.bubbleUnlocked.add(unlockedSkin);
          applyBubbleSkin(unlockedSkin);
        }

        grantTrapVision(TRAP_VISION_MS);
        state.adCooldownUntil = Date.now() + AD_COOLDOWN_MS;

        if (unlockedSkin) {
          showToast(`"${unlockedSkin}" skin + 👁️ 10s Trap Vision!`);
        } else {
          showToast('👁️ 10s Trap Vision granted!');
        }
      } catch (err) {
        console.error('[PopZen] Ad error:', err);
        showToast('Ad unavailable, try later');
      } finally {
        state.adPlaying = false;
        updateAdButton();
      }
    }
    adBtn.addEventListener('click', watchRewardedAd);

    /* =========================================================
       LEADERBOARD
       ========================================================= */
    function prizeForRank(rank, isHouse) {
      if (isHouse) return '—';
      if (rank === 1) return '$10';
      if (rank === 2 || rank === 3) return '$5';
      if (rank >= 4 && rank <= 10) return '$2';
      return '—';
    }

    async function loadLeaderboard() {
      leaderboardList.innerHTML = '<div class="lb-empty">Loading…</div>';
      try {
        const res = await fetch(`/api/leaderboard?limit=${LEADERBOARD_LIMIT}`);
        const data = await res.json();
        if (!data.rows || data.rows.length === 0) {
          leaderboardList.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>';
          return;
        }
        leaderboardList.innerHTML = '';
        data.rows.forEach((row, i) => {
          const rank = i + 1;
          const isHouse = row.is_house === true;
          const isSelf = row.telegram_id === state.telegramUserId;
          const name = isHouse
            ? 'Pop Lion'
            : (row.username ? '@' + row.username : (row.first_name || 'Player'));
          const div = document.createElement('div');
          div.className = 'lb-row'
            + (isHouse ? ' house' : '')
            + (isSelf ? ' self' : '');
          div.innerHTML = `
            <div class="lb-rank">${isHouse ? '🏠' : '#' + rank}</div>
            <div class="lb-name">
              ${escapeHtml(name)}
              ${isHouse ? '<span class="lb-badge">HOUSE</span>' : ''}
            </div>
            <div class="lb-score">${row.best_score}</div>
            <div class="lb-prize ${isHouse || rank > 10 ? 'none' : ''}">
              ${prizeForRank(isHouse ? 99 : rank, isHouse)}
            </div>
          `;
          leaderboardList.appendChild(div);
        });
      } catch (err) {
        console.error('[PopZen] Leaderboard load failed:', err);
        leaderboardList.innerHTML = '<div class="lb-empty">Could not load leaderboard.</div>';
      }
    }
    lbRefreshBtn.addEventListener('click', loadLeaderboard);

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    /* =========================================================
       SHARE
       ========================================================= */
    function shareApp() {
      const botUsername = 'PopZenPlayBot';
      const scoreText = state.score > 0
        ? `I scored ${state.score} on PopZen! Beat me →`
        : `🫧 I'm hooked on PopZen — pop bubbles to relax. Try it!`;
      const shareUrl = `https://t.me/${botUsername}/play`;

      if (tg && tg.openTelegramLink) {
        const shareLink =
          `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}` +
          `&text=${encodeURIComponent(scoreText)}`;
        tg.openTelegramLink(shareLink);
      } else if (navigator.share) {
        navigator.share({ title: 'PopZen', text: scoreText, url: shareUrl }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(scoreText + '\n' + shareUrl)
          .then(() => showToast('Link copied!'))
          .catch(() => showToast('Could not share'));
      } else {
        showToast('Sharing not available');
      }
    }
    shareBtn.addEventListener('click', shareApp);

    /* =========================================================
       OVERLAY HANDLERS
       ========================================================= */
    document.getElementById('recordClose').addEventListener('click', () => {
      recordOverlay.classList.remove('show');
    });

    function restartGame() {
      gameOverOverlay.classList.remove('show');
      state.score = 0;
      state.gameOver = false;
      state.recordShownThisGame = false;
      scoreEl.textContent = '0';
      buildGrid();
    }
    document.getElementById('restartBtn').addEventListener('click', restartGame);

    /* =========================================================
       STREAK
       ========================================================= */
    function checkStreak() {
      const today = new Date().toISOString().slice(0, 10);
      const last = localStorage.getItem('popzen_lastOpen');
      let streak = parseInt(localStorage.getItem('popzen_streak') || '0', 10);

      if (last === today) {
        // already opened today
      } else if (last) {
        const diffDays = Math.round((new Date(today) - new Date(last)) / 86400000);
        streak = diffDays === 1 ? streak + 1 : 1;
      } else {
        streak = 1;
      }

      localStorage.setItem('popzen_lastOpen', today);
      localStorage.setItem('popzen_streak', String(streak));

      const banner = document.getElementById('streakBanner');
      const countEl = document.getElementById('streakCount');
      const rewardEl = document.getElementById('streakReward');
      banner.style.display = 'flex';
      countEl.textContent = streak;

      const milestones = { 3: 'glitter', 7: 'neon' };
      let rewardMsg = '';
      const milestoneSkin = milestones[streak];
      if (milestoneSkin && state.bubbleSkins.includes(milestoneSkin) && !state.bubbleUnlocked.has(milestoneSkin)) {
        state.bubbleUnlocked.add(milestoneSkin);
        applyBubbleSkin(milestoneSkin);
        rewardMsg = `🎁 Free "${milestoneSkin}" skin!`;
      }

      if (rewardMsg) {
        rewardEl.textContent = rewardMsg;
        showToast(rewardMsg);
        updateAdButton();
      } else {
        const next = streak < 3 ? 3 : streak < 7 ? 7 : null;
        rewardEl.textContent = next
          ? `${next - streak} day${next - streak > 1 ? 's' : ''} to free skin`
          : '🔥 Max streak!';
      }
    }

    /* =========================================================
       INIT
       ========================================================= */
    buildGrid();
    applyBubbleSkin('default');
    checkStreak();
    updateAdButton();
    checkMembership();
  </script>
</body>
</html>

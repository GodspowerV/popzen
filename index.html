<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PopZen</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK (Rewarded Interstitial) -->
  <script src="https://libtl.com/sdk.js" data-zone="12162761" data-sdk="show_12162761"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff; overflow: hidden; user-select: none; overscroll-behavior: none;
    }
    #app {
      display: flex; flex-direction: column; height: 100vh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-size: 22px; font-weight: 700; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ff6bcb, #8a7bff, #4facfe);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-right { display: flex; gap: 8px; align-items: center; }
    .best-box {
      background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.35);
      border-radius: 12px; padding: 6px 12px; font-size: 14px; font-weight: 700;
      color: #ffd700; text-align: center;
    }
    .score-box {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; padding: 6px 14px; font-size: 15px; font-weight: 600;
      min-width: 90px; text-align: center;
    }
    .score-box span { color: #8a7bff; }

    /* Trap vision indicator */
    #trapVisionBar {
      display: none;
      background: linear-gradient(90deg, rgba(255,80,80,0.3), rgba(255,160,0,0.3));
      border: 1px solid rgba(255,120,80,0.6);
      border-radius: 12px; padding: 8px 14px;
      font-size: 14px; font-weight: 700; margin-bottom: 10px;
      text-align: center; color: #ffcc99;
      animation: tvPulse 1s infinite;
    }
    #trapVisionBar.active { display: block; }
    @keyframes tvPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

    /* Streak banner */
    .streak-banner {
      background: linear-gradient(90deg, rgba(255,107,203,0.2), rgba(138,123,255,0.2));
      border: 1px solid rgba(255,107,203,0.4);
      border-radius: 12px; padding: 8px 14px;
      font-size: 14px; font-weight: 600; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .streak-reward {
      margin-left: auto; font-size: 12px; color: #ffd1ff; font-weight: 500;
    }

    /* Mode tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab {
      flex: 1; padding: 10px; border-radius: 12px; text-align: center;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .tab.active {
      background: rgba(138,123,255,0.25); border-color: rgba(138,123,255,0.6);
    }

    /* Panels */
    .panel { flex: 1; display: none; overflow: hidden; }
    .panel.active { display: flex; flex-direction: column; }

    /* ===== BUBBLES ===== */
    #grid {
      flex: 1; display: grid; grid-template-columns: repeat(6, 1fr);
      gap: 8px; align-content: start; overflow: hidden;
    }
    .bubble {
      aspect-ratio: 1 / 1; border-radius: 50%; cursor: pointer; position: relative;
      transition: transform 0.08s ease, opacity 0.2s ease;
      box-shadow: inset -3px -3px 8px rgba(0,0,0,0.25),
                  inset 3px 3px 8px rgba(255,255,255,0.35),
                  0 2px 6px rgba(0,0,0,0.3);
    }
    .bubble:active { transform: scale(0.85); }
    .bubble.popped { opacity: 0; transform: scale(0.3); pointer-events: none; }
    .bubble.c0 { background: radial-gradient(circle at 30% 30%, #ff9a9e, #f6416c); }
    .bubble.c1 { background: radial-gradient(circle at 30% 30%, #a1c4fd, #3a7bd5); }
    .bubble.c2 { background: radial-gradient(circle at 30% 30%, #fddb92, #f7a325); }
    .bubble.c3 { background: radial-gradient(circle at 30% 30%, #a8edea, #28c7a8); }
    .bubble.c4 { background: radial-gradient(circle at 30% 30%, #d4a5ff, #8a2be2); }
    .bubble.c5 { background: radial-gradient(circle at 30% 30%, #ffd1ff, #ff6bcb); }

    /* Skins must NOT affect traps */
    body.skin-glitter .bubble:not(.trap.visible) {
      background-image:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, transparent 40%),
        repeating-conic-gradient(from 0deg, rgba(255,255,255,0.35) 0deg 10deg, transparent 10deg 20deg);
      background-blend-mode: overlay;
    }
    body.skin-neon .bubble:not(.trap.visible) {
      box-shadow: 0 0 14px 2px currentColor,
                  inset -3px -3px 8px rgba(0,0,0,0.25),
                  inset 3px 3px 8px rgba(255,255,255,0.35);
    }

    /* Traps — hidden by default, visible only with trap vision */
    .bubble.trap { pointer-events: auto; }
    .bubble.trap.visible {
      background: radial-gradient(circle at 35% 30%, #ff6b6b, #c0392b) !important;
      box-shadow: 0 0 16px 3px rgba(255,60,60,0.8),
                  inset -3px -3px 8px rgba(0,0,0,0.3),
                  inset 3px 3px 8px rgba(255,255,255,0.25) !important;
      animation: trapPulse 0.9s infinite;
    }
    .bubble.trap.visible::after {
      content: '💥';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 60%;
    }
    @keyframes trapPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.92); }
    }
    .bubble.trap.fading { opacity: 0; transform: scale(0.4); transition: opacity 0.3s, transform 0.3s; }

    /* ===== SLIME ===== */
    #slimeWrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; touch-action: none; cursor: grab;
    }
    #slimeWrap:active { cursor: grabbing; }
    #slimeSvg { width: 100%; height: 100%; max-height: 420px; }
    #slimeBody {
      fill: url(#slimeGrad);
      filter: drop-shadow(0 8px 20px rgba(138,123,255,0.4));
      transition: fill 0.3s;
    }
    body.slime-glitter #slimeBody { fill: url(#slimeGlitter); }
    body.slime-lava    #slimeBody { fill: url(#slimeLava); }
    .slime-hint {
      position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
      font-size: 12px; opacity: 0.55; pointer-events: none;
    }

    /* Footer */
    .footer { margin-top: 12px; display: flex; gap: 8px; }
    button {
      border: none; border-radius: 14px; padding: 14px 10px;
      font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      flex: 1;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #shareBtn {
      background: rgba(79,172,254,0.25);
      border: 1px solid rgba(79,172,254,0.5);
      flex: 0.7;
    }
    #adBtn {
      background: linear-gradient(90deg, #ff6bcb, #8a7bff);
      box-shadow: 0 4px 16px rgba(138,123,255,0.4);
      flex: 1.3;
    }
    #adBtn.tv-active {
      background: linear-gradient(90deg, #ff6b3d, #ff3d6b);
      box-shadow: 0 4px 16px rgba(255,80,60,0.5);
      animation: tvPulse 1s infinite;
    }

    #toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 20px;
      font-size: 14px; opacity: 0; pointer-events: none;
      transition: opacity 0.25s, transform 0.25s; white-space: nowrap; z-index: 10;
      max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Overlays */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 20; backdrop-filter: blur(6px);
    }
    .overlay.show { display: flex; }
    .overlay-card {
      background: linear-gradient(160deg, #1e2a4a, #16213e);
      border: 1px solid rgba(138,123,255,0.5);
      border-radius: 24px; padding: 32px 28px; text-align: center;
      max-width: 320px; width: 85%;
      animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    @keyframes cardPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .overlay-emoji { font-size: 56px; margin-bottom: 12px; }
    .overlay-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .overlay-title.record { color: #ffd700; }
    .overlay-title.gameover { color: #ff6b6b; }
    .overlay-sub { font-size: 15px; opacity: 0.8; margin-bottom: 24px; }
    .overlay-btn {
      background: linear-gradient(90deg, #8a7bff, #4facfe);
      box-shadow: 0 4px 16px rgba(138,123,255,0.5);
      font-size: 16px; padding: 14px; width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="title">PopZen</div>
      <div class="header-right">
        <div class="best-box">Best: <span id="best">0</span></div>
        <div class="score-box">Score: <span id="score">0</span></div>
      </div>
    </header>

    <!-- Trap vision countdown -->
    <div id="trapVisionBar">👁️ Trap Vision — <span id="trapVisionSecs">0</span>s</div>

    <!-- Daily streak banner (shown by JS) -->
    <div id="streakBanner" class="streak-banner" style="display:none;">
      🔥 <span id="streakCount">0</span>-day streak
      <span id="streakReward" class="streak-reward"></span>
    </div>

    <div class="tabs">
      <div class="tab active" data-mode="bubbles">🫧 Bubbles</div>
      <div class="tab" data-mode="slime">🟢 Slime</div>
    </div>

    <!-- BUBBLES PANEL -->
    <div class="panel active" id="panel-bubbles">
      <div id="grid"></div>
    </div>

    <!-- SLIME PANEL -->
    <div class="panel" id="panel-slime">
      <div id="slimeWrap">
        <svg id="slimeSvg" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet">
          <defs>
            <radialGradient id="slimeGrad" cx="40%" cy="35%">
              <stop offset="0%" stop-color="#a8edea"/>
              <stop offset="100%" stop-color="#28c7a8"/>
            </radialGradient>
            <radialGradient id="slimeGlitter" cx="40%" cy="35%">
              <stop offset="0%" stop-color="#ffd1ff"/>
              <stop offset="60%" stop-color="#ff6bcb"/>
              <stop offset="100%" stop-color="#8a2be2"/>
            </radialGradient>
            <radialGradient id="slimeLava" cx="40%" cy="35%">
              <stop offset="0%" stop-color="#fddb92"/>
              <stop offset="100%" stop-color="#f6416c"/>
            </radialGradient>
          </defs>
          <path id="slimeBody" d=""/>
        </svg>
        <div class="slime-hint">Drag the slime to stretch it 🫳</div>
      </div>
    </div>

    <div class="footer">
      <button id="shareBtn">📤 Share</button>
      <button id="adBtn">🎁 Unlock</button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Record overlay -->
  <div id="recordOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-emoji">🏆</div>
      <div class="overlay-title record">New Record!</div>
      <div class="overlay-sub">You scored <span id="recordScore">0</span> — amazing!</div>
      <button class="overlay-btn" id="recordClose">Keep popping</button>
    </div>
  </div>

  <!-- Game over overlay -->
  <div id="gameOverOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-emoji">💥</div>
      <div class="overlay-title gameover">Boom! Trap hit</div>
      <div class="overlay-sub">You scored <span id="finalScore">0</span></div>
      <button class="overlay-btn" id="restartBtn">Play again</button>
    </div>
  </div>

  <script>
    /* =========================================================
       TELEGRAM
       ========================================================= */
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    /* =========================================================
       STATE
       ========================================================= */
    const state = {
      mode: 'bubbles',
      score: 0,
      bestScore: parseInt(localStorage.getItem('popzen_best') || '0', 10),
      bubbleSkins: ['default', 'glitter', 'neon'],
      bubbleUnlocked: new Set(['default']),
      bubbleActive: 'default',
      slimeSkins: ['default', 'glitter', 'lava'],
      slimeUnlocked: new Set(['default']),
      slimeActive: 'default',
      adCooldownUntil: 0,
      adPlaying: false,
      adCooldownMs: 60000,
      trapVisionUntil: 0,
      gameOver: false,
      recordShownThisGame: false,
    };

    /* =========================================================
       DOM
       ========================================================= */
    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const adBtn = document.getElementById('adBtn');
    const shareBtn = document.getElementById('shareBtn');
    const toastEl = document.getElementById('toast');
    const tabs = document.querySelectorAll('.tab');
    const panelBubbles = document.getElementById('panel-bubbles');
    const panelSlime = document.getElementById('panel-slime');
    const trapVisionBar = document.getElementById('trapVisionBar');
    const trapVisionSecs = document.getElementById('trapVisionSecs');
    const recordOverlay = document.getElementById('recordOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');

    bestEl.textContent = state.bestScore;

    /* =========================================================
       AUDIO
       ========================================================= */
    let audioCtx = null;
    function beep(freqStart, freqEnd, dur, gainVal = 0.15, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), t + dur);
        g.gain.setValueAtTime(gainVal, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(g).connect(audioCtx.destination);
        osc.start(t); osc.stop(t + dur + 0.02);
      } catch (e) {}
    }
    const playPop = () => beep(600 + Math.random() * 300, 120, 0.1, 0.15);
    const playSquish = () => beep(300, 80, 0.12, 0.12, 'triangle');
    const playTrap = () => {
      beep(200, 50, 0.3, 0.25, 'sawtooth');
      setTimeout(() => beep(150, 40, 0.25, 0.2, 'square'), 80);
    };
    const playRecord = () => {
      [523, 659, 784, 1047].forEach((f, i) =>
        setTimeout(() => beep(f, f * 1.01, 0.15, 0.18), i * 100)
      );
    };

    function haptic(type = 'light') {
      try { tg?.HapticFeedback?.impactOccurred(type); } catch (e) {}
    }

    /* =========================================================
       TOAST
       ========================================================= */
    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
    }

    /* =========================================================
       MODE SWITCH
       ========================================================= */
    function setMode(mode) {
      state.mode = mode;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      panelBubbles.classList.toggle('active', mode === 'bubbles');
      panelSlime.classList.toggle('active', mode === 'slime');
      state.score = 0;
      state.gameOver = false;
      state.recordShownThisGame = false;
      scoreEl.textContent = '0';
      if (mode === 'bubbles') buildGrid();
      else resetSlime();
      updateAdButton();
    }
    tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));

    /* =========================================================
       BUBBLES MODE
       ========================================================= */
    const GRID_COUNT = 36;

    function trapRateForScore(score) {
      if (score <= 10) return 0.08;
      if (score <= 25) return 0.15;
      if (score <= 50) return 0.22;
      return 0.30;
    }

    // buildGrid(opts): preserveScore keeps the running score and record flag
    // (used for mid-game auto-rebuild when all safe bubbles are cleared).
    function buildGrid(opts = {}) {
      const { preserveScore = false } = opts;
      gridEl.innerHTML = '';
      state.gameOver = false;
      if (!preserveScore) state.recordShownThisGame = false;

      // Determine trap count — never all traps, always at least 1 trap, always ≥5 safe
      const rate = trapRateForScore(state.score);
      let trapCount = Math.round(GRID_COUNT * rate);
      trapCount = Math.max(1, Math.min(GRID_COUNT - 5, trapCount));

      // Pick trap indices
      const indices = Array.from({ length: GRID_COUNT }, (_, i) => i);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      const trapSet = new Set(indices.slice(0, trapCount));

      for (let i = 0; i < GRID_COUNT; i++) {
        const b = document.createElement('div');
        const colorIdx = Math.floor(Math.random() * 6);
        b.className = `bubble c${colorIdx}`;
        if (trapSet.has(i)) {
          b.classList.add('trap');
          b.dataset.trap = '1';
        }
        const scale = 0.85 + Math.random() * 0.25;
        b.style.transform = `scale(${scale})`;
        b.addEventListener('pointerdown', () => handleBubbleClick(b));
        gridEl.appendChild(b);
      }

      // Apply current trap-vision state to the fresh grid immediately.
      // If trapVisionUntil > now → new traps show right away.
      // If trapVisionUntil <= now → new traps stay hidden until next ad.
      refreshTrapVisibility();
    }

    function handleBubbleClick(el) {
      if (state.gameOver) return;
      if (el.classList.contains('popped') || el.classList.contains('fading')) return;

      if (el.classList.contains('trap')) {
        // Trap hit — game over. Works whether or not trap vision is active.
        playTrap();
        haptic('heavy');
        state.gameOver = true;
        document.getElementById('finalScore').textContent = state.score;
        gameOverOverlay.classList.add('show');
        return;
      }

      // Safe bubble
      el.classList.add('popped');
      playPop();
      haptic('light');
      setScore(state.score + 1);

      // Check if all safe bubbles popped → load next wave immediately
      checkGridCleared();
    }

    function checkGridCleared() {
      const remainingSafe = gridEl.querySelectorAll('.bubble:not(.trap):not(.popped)');
      if (remainingSafe.length === 0 && !state.gameOver) {
        // Fade out remaining traps for visual feedback
        gridEl.querySelectorAll('.bubble.trap:not(.fading)').forEach(t => {
          t.classList.add('fading');
        });
        showToast('Grid cleared! 🎉');
        // Rebuild immediately — no waiting on the trap-vision timer.
        // buildGrid() -> refreshTrapVisibility() reads the LIVE trap-vision state,
        // so new traps are visible if the timer is still running, hidden if expired.
        buildGrid({ preserveScore: true });
      }
    }

    function setScore(v) {
      state.score = v;
      scoreEl.textContent = v;

      // Record check (once per game session)
      if (v > state.bestScore && !state.recordShownThisGame) {
        state.recordShownThisGame = true;
        state.bestScore = v;
        bestEl.textContent = v;
        localStorage.setItem('popzen_best', String(v));
        playRecord();
        haptic('medium');
        document.getElementById('recordScore').textContent = v;
        recordOverlay.classList.add('show');
      } else if (v > state.bestScore) {
        // Update best silently if record already shown this session
        state.bestScore = v;
        bestEl.textContent = v;
        localStorage.setItem('popzen_best', String(v));
      }
    }

    /* =========================================================
       TRAP VISION
       ========================================================= */
    function trapVisionActive() {
      return Date.now() < state.trapVisionUntil;
    }

    function grantTrapVision(ms) {
      state.trapVisionUntil = Date.now() + ms;
      refreshTrapVisibility();
      updateTrapVisionUI();
    }

    function refreshTrapVisibility() {
      const active = trapVisionActive();
      gridEl.querySelectorAll('.bubble.trap').forEach(el => {
        el.classList.toggle('visible', active);
      });
    }

    function updateTrapVisionUI() {
      const remaining = state.trapVisionUntil - Date.now();
      if (remaining > 0) {
        trapVisionBar.classList.add('active');
        trapVisionSecs.textContent = Math.ceil(remaining / 1000);
        adBtn.classList.add('tv-active');
      } else {
        trapVisionBar.classList.remove('active');
        adBtn.classList.remove('tv-active');
      }
    }

    // Countdown ticker
    setInterval(() => {
      if (state.trapVisionUntil > 0) {
        updateTrapVisionUI();
        if (!trapVisionActive()) {
          state.trapVisionUntil = 0;
          refreshTrapVisibility();
          updateAdButton();
        }
      }
    }, 500);

    /* =========================================================
       SLIME MODE
       ========================================================= */
    const svg = document.getElementById('slimeSvg');
    const slimePath = document.getElementById('slimeBody');
    const slimeWrap = document.getElementById('slimeWrap');

    const slime = {
      cx: 150, cy: 150, baseR: 70,
      pullX: 0, pullY: 0,
      targetX: 0, targetY: 0,
      velX: 0, velY: 0,
      dragging: false,
      raf: null,
      squishPlayed: false,
    };

    function slimeLoop() {
      const stiffness = slime.dragging ? 0.25 : 0.08;
      const damping = slime.dragging ? 0.75 : 0.82;
      slime.velX = (slime.velX + (slime.targetX - slime.pullX) * stiffness) * damping;
      slime.velY = (slime.velY + (slime.targetY - slime.pullY) * stiffness) * damping;
      slime.pullX += slime.velX;
      slime.pullY += slime.velY;

      drawSlime();

      const dist = Math.hypot(slime.pullX, slime.pullY);
      if (dist > 40 && !slime.squishPlayed) {
        slime.squishPlayed = true;
        playSquish();
        haptic('medium');
      } else if (dist < 20) {
        slime.squishPlayed = false;
      }

      slime.raf = requestAnimationFrame(slimeLoop);
    }

    function drawSlime() {
      const { cx, cy, baseR, pullX, pullY } = slime;
      const d = Math.hypot(pullX, pullY);
      const angle = Math.atan2(pullY, pullX);
      const stretch = Math.min(1.8, 1 + d / 200);
      const squash = 1 / stretch;

      const noseX = cx + Math.cos(angle) * (baseR * stretch);
      const noseY = cy + Math.sin(angle) * (baseR * stretch);
      const backX = cx - Math.cos(angle) * (baseR * squash * 0.9);
      const backY = cy - Math.sin(angle) * (baseR * squash * 0.9);

      const perpX = -Math.sin(angle);
      const perpY = Math.cos(angle);
      const sideOffset = baseR * (1 - 0.15 * (stretch - 1));

      const s1x = cx + perpX * sideOffset;
      const s1y = cy + perpY * sideOffset;
      const s2x = cx - perpX * sideOffset;
      const s2y = cy - perpY * sideOffset;

      const c1x = (noseX + s1x) / 2 + perpX * baseR * 0.6;
      const c1y = (noseY + s1y) / 2 + perpY * baseR * 0.6;
      const c2x = (noseX + s2x) / 2 - perpX * baseR * 0.6;
      const c2y = (noseY + s2y) / 2 - perpY * baseR * 0.6;
      const c3x = (backX + s2x) / 2 - perpX * baseR * 0.5;
      const c3y = (backY + s2y) / 2 - perpY * baseR * 0.5;
      const c4x = (backX + s1x) / 2 + perpX * baseR * 0.5;
      const c4y = (backY + s1y) / 2 + perpY * baseR * 0.5;

      const d_path =
        `M ${s1x} ${s1y} ` +
        `Q ${c1x} ${c1y} ${noseX} ${noseY} ` +
        `Q ${c2x} ${c2y} ${s2x} ${s2y} ` +
        `Q ${c3x} ${c3y} ${backX} ${backY} ` +
        `Q ${c4x} ${c4y} ${s1x} ${s1y} Z`;

      slimePath.setAttribute('d', d_path);
    }

    function resetSlime() {
      slime.pullX = 0; slime.pullY = 0;
      slime.targetX = 0; slime.targetY = 0;
      slime.velX = 0; slime.velY = 0;
      slime.dragging = false;
      if (!slime.raf) slime.raf = requestAnimationFrame(slimeLoop);
    }

    function slimePointer(e) {
      const rect = svg.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 300;
      const y = ((e.clientY - rect.top) / rect.height) * 300;
      const dx = x - slime.cx;
      const dy = y - slime.cy;
      const maxPull = 90;
      const dist = Math.hypot(dx, dy);
      const f = dist > maxPull ? maxPull / dist : 1;
      slime.targetX = dx * f;
      slime.targetY = dy * f;
      const currentDist = Math.hypot(slime.targetX, slime.targetY);
      if (currentDist > state.score) {
        setScore(Math.floor(currentDist));
      }
    }

    slimeWrap.addEventListener('pointerdown', (e) => {
      slime.dragging = true;
      slime.squishPlayed = false;
      slimePointer(e);
      slimeWrap.setPointerCapture?.(e.pointerId);
    });
    slimeWrap.addEventListener('pointermove', (e) => {
      if (slime.dragging) slimePointer(e);
    });
    slimeWrap.addEventListener('pointerup', () => { slime.dragging = false; slime.targetX = 0; slime.targetY = 0; });
    slimeWrap.addEventListener('pointerleave', () => { slime.dragging = false; slime.targetX = 0; slime.targetY = 0; });

    /* =========================================================
       SKIN / AD BUTTON
       ========================================================= */
    function nextLocked(mode) {
      if (mode === 'bubbles') return state.bubbleSkins.find(s => !state.bubbleUnlocked.has(s));
      return state.slimeSkins.find(s => !state.slimeUnlocked.has(s));
    }

    function cooldownRemaining() {
      return Math.max(0, state.adCooldownUntil - Date.now());
    }

    function updateAdButton() {
      if (state.adPlaying) {
        adBtn.textContent = 'Loading ad...';
        adBtn.disabled = true;
        return;
      }
      const cd = cooldownRemaining();
      if (cd > 0) {
        adBtn.textContent = `⏳ ${Math.ceil(cd / 1000)}s`;
        adBtn.disabled = true;
        setTimeout(updateAdButton, 500);
        return;
      }
      // Cooldown clear → button is always live. Skins are an optional one-time
      // bonus; trap vision is the recurring reward and must never be "used up".
      const next = nextLocked(state.mode);
      adBtn.textContent = next
        ? `🎁 Unlock ${next} + 👁️ 60s`
        : `👁️ Watch ad — 60s Trap Vision`;
      adBtn.disabled = false;
    }

    function applyBubbleSkin(skin) {
      state.bubbleActive = skin;
      document.body.classList.remove('skin-glitter', 'skin-neon');
      if (skin !== 'default') document.body.classList.add(`skin-${skin}`);
    }
    function applySlimeSkin(skin) {
      state.slimeActive = skin;
      document.body.classList.remove('slime-glitter', 'slime-lava');
      if (skin !== 'default') document.body.classList.add(`slime-${skin}`);
    }

    /* =========================================================
       MONETAG REWARDED INTERSTITIAL
       SDK function: show_12162761
       Reward fires directly on Promise resolve.
       ========================================================= */
    async function watchRewardedAd() {
      if (state.adPlaying) return;
      if (cooldownRemaining() > 0) return;

      const showAd = window.show_12162761;
      if (typeof showAd !== 'function') {
        showToast('Ad SDK not loaded');
        console.warn('[PopZen] show_12162761 not found.');
        return;
      }

      state.adPlaying = true;
      updateAdButton();

      try {
        try { await showAd({ type: 'preload' }); } catch (e) {}

        await showAd();

        // Reward: unlock next skin (if any) AND grant 60s trap vision (always).
        let unlockedSkin = null;
        if (state.mode === 'bubbles') {
          unlockedSkin = nextLocked('bubbles');
          if (unlockedSkin) {
            state.bubbleUnlocked.add(unlockedSkin);
            applyBubbleSkin(unlockedSkin);
          }
        } else {
          unlockedSkin = nextLocked('slime');
          if (unlockedSkin) {
            state.slimeUnlocked.add(unlockedSkin);
            applySlimeSkin(unlockedSkin);
          }
        }

        grantTrapVision(60000);
        state.adCooldownUntil = Date.now() + state.adCooldownMs;

        if (unlockedSkin) {
          showToast(`"${unlockedSkin}" skin + 👁️ 60s Trap Vision!`);
        } else {
          showToast('👁️ 60s Trap Vision granted!');
        }
      } catch (err) {
        console.error('[PopZen] Ad error:', err);
        showToast('Ad unavailable, try later');
      } finally {
        state.adPlaying = false;
        updateAdButton();
      }
    }

    /* =========================================================
       SHARE FEATURE
       ========================================================= */
    function shareApp() {
      const botUsername = 'PopZenPlayBot';
      const scoreText = state.score > 0
        ? `I scored ${state.score} on PopZen! Beat me →`
        : `🫧 I'm hooked on PopZen — pop bubbles & stretch slime to relax. Try it!`;
      const shareUrl = `https://t.me/${botUsername}/play`;

      if (tg && tg.openTelegramLink) {
        const shareLink =
          `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}` +
          `&text=${encodeURIComponent(scoreText)}`;
        tg.openTelegramLink(shareLink);
      } else if (navigator.share) {
        navigator.share({ title: 'PopZen', text: scoreText, url: shareUrl }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(scoreText + '\n' + shareUrl)
          .then(() => showToast('Link copied! Paste it anywhere 📋'))
          .catch(() => showToast('Could not share'));
      } else {
        showToast('Sharing not available');
      }
    }
    shareBtn.addEventListener('click', shareApp);

    /* =========================================================
       OVERLAY HANDLERS
       ========================================================= */
    document.getElementById('recordClose').addEventListener('click', () => {
      recordOverlay.classList.remove('show');
    });

    function restartGame() {
      gameOverOverlay.classList.remove('show');
      state.score = 0;
      state.gameOver = false;
      state.recordShownThisGame = false;
      scoreEl.textContent = '0';
      if (state.mode === 'bubbles') {
        buildGrid();
      } else {
        resetSlime();
      }
    }
    document.getElementById('restartBtn').addEventListener('click', restartGame);

    /* =========================================================
       DAILY STREAK SYSTEM
       Milestones grant FREE SKINS only. NEVER trap vision.
       Trap vision is AD-ONLY (see watchRewardedAd above).
       ========================================================= */
    function checkStreak() {
      const today = new Date().toISOString().slice(0, 10);
      const last = localStorage.getItem('popzen_lastOpen');
      let streak = parseInt(localStorage.getItem('popzen_streak') || '0', 10);

      if (last === today) {
        // Already opened today
      } else if (last) {
        const diffDays = Math.round(
          (new Date(today) - new Date(last)) / 86400000
        );
        streak = diffDays === 1 ? streak + 1 : 1;
      } else {
        streak = 1;
      }

      localStorage.setItem('popzen_lastOpen', today);
      localStorage.setItem('popzen_streak', String(streak));

      const banner = document.getElementById('streakBanner');
      const countEl = document.getElementById('streakCount');
      const rewardEl = document.getElementById('streakReward');
      banner.style.display = 'flex';
      countEl.textContent = streak;

      // Milestone free-skin unlocks (NO trap vision here — AD-ONLY)
      const milestones = { 3: 'glitter', 7: 'neon', 14: 'lava' };
      let rewardMsg = '';
      const milestoneSkin = milestones[streak];
      if (milestoneSkin) {
        if (state.bubbleSkins.includes(milestoneSkin) && !state.bubbleUnlocked.has(milestoneSkin)) {
          state.bubbleUnlocked.add(milestoneSkin);
          applyBubbleSkin(milestoneSkin);
          rewardMsg = `🎁 Free "${milestoneSkin}" bubble skin!`;
        } else if (state.slimeSkins.includes(milestoneSkin) && !state.slimeUnlocked.has(milestoneSkin)) {
          state.slimeUnlocked.add(milestoneSkin);
          applySlimeSkin(milestoneSkin);
          rewardMsg = `🎁 Free "${milestoneSkin}" slime skin!`;
        }
      }

      if (rewardMsg) {
        rewardEl.textContent = rewardMsg;
        showToast(rewardMsg);
        updateAdButton();
      } else {
        const next = streak < 3 ? 3 : streak < 7 ? 7 : streak < 14 ? 14 : null;
        rewardEl.textContent = next
          ? `${next - streak} day${next - streak > 1 ? 's' : ''} to free skin`
          : '🔥 Max streak!';
      }
    }

    /* =========================================================
       WIRE UP
       ========================================================= */
    adBtn.addEventListener('click', watchRewardedAd);

    /* =========================================================
       INIT SEQUENCE
       ========================================================= */
    buildGrid();
    applyBubbleSkin('default');
    applySlimeSkin('default');
    resetSlime();
    checkStreak();
    updateAdButton();
  </script>
</body>
</html>
